name: CI

# Build, lint, and test gate on every PR and push to main. Without this, the
# only workflow that compiles the code is release.yaml (tag-triggered), so a
# change that breaks the Linux build — for example the Linux-only Wayland
# portal, x11rb, or GPU-feature paths, none of which compile on a macOS dev
# machine — would not surface until a release was cut. This job compiles the
# Linux target with the same feature set the release uses, so Linux breakage is
# caught at PR time.

on:
  pull_request:
  push:
    branches:
      - main
  # Manual trigger so the Linux build can be run from the Actions tab on a
  # feature branch (e.g. fix/linux-wayland-parity) without opening a PR — the
  # only way to compile-check the Linux-only code before it reaches main.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the primary target. Default features (Whisper Metal +
          # Parakeet + FluidAudio), so the macOS-only modules are compiled.
          - platform: macos-15
            args: ''
          # Linux: the same feature set release.yaml ships — defaults off,
          # Vulkan on. This compiles the Linux-only code (Wayland portal via
          # ashpd, x11rb mouse tracking, the Vulkan whisper backend) that never
          # builds on a macOS dev machine. Parakeet/FluidAudio are excluded as
          # in the release build: Parakeet now links statically on Linux (the old
          # sherpa-rs blocker is gone) but a Parakeet transcription is not yet
          # runtime-verified on a glibc desktop and crashes at model init under
          # the Nix toolchain — opt in with `--features parakeet` to test (#53).
          - platform: ubuntu-22.04
            args: '--no-default-features --features vulkan'

    # by-exception (2026-07-03): cross-platform compilation gate — macOS
    # Metal/Swift toolchain and Linux Vulkan/Wayland code cannot build on the
    # household self-hosted runner (atlas is macOS-only); both platforms must
    # be tested natively.
    runs-on: ${{ matrix.platform }}

    # Hard ceiling on the whole job. GitHub's default is 6 hours, which is long
    # enough that a stalled step reads as "still building" — on 2026-08-18 a hung
    # apt fetch ran 3.5 hours unnoticed. A cold-cache Linux build is ~33 minutes,
    # so 60 leaves headroom while turning a stall into a prompt failure.
    timeout-minutes: 60

    # macOS Apple Silicon runners: whisper.cpp's GGML detects the i8mm CPU
    # feature via -march=native and emits vmmlaq_s32 intrinsics, then fails to
    # compile because the target feature isn't enabled for the function being
    # inlined into. GGML_NATIVE=OFF stops GGML overriding our -march, and the
    # explicit armv8 baseline keeps the i8mm intrinsics out. Empty on Linux.
    env:
      GGML_NATIVE: ${{ matrix.platform == 'macos-15' && 'OFF' || '' }}
      CFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
      CXXFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Runs before the build so a drift regression fails in seconds rather
      # than after a 30-minute compile.
      - name: Guard shared Vulkan install (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./scripts/test-install-vulkan-sdk.sh

      # The install lives in scripts/install-vulkan-sdk.sh so this and
      # release.yaml share one definition instead of two copies that drift.
      # timeout-minutes is a backstop: the script bounds its own network calls,
      # but a step with no ceiling can burn the job's whole budget if something
      # stalls in a way the script does not anticipate.
      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: ./scripts/install-vulkan-sdk.sh

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          # GUI + audio libs Tauri needs to compile. desktop-file-utils provides
          # desktop-file-validate used below. The Vulkan toolchain is installed
          # by the Vulkan SDK step above.
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev desktop-file-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: ./src-tauri
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

      - name: Test
        working-directory: ./src-tauri
        run: cargo test ${{ matrix.args }}

      - name: Validate desktop entry (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: desktop-file-validate src-tauri/linux/thoth.desktop

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Inline ntfy notify: thoth is a private repo; vendor-hosted runners
          # cannot resolve composite actions from poodle64/master-project (also
          # private) at job-setup time, so the notify step is inlined here.
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: thoth: rust (${{ matrix.platform }}) failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy notify POST failed"

  frontend:
    name: Frontend
    runs-on: [self-hosted, atlas]

    # Tighter than the rust job's ceiling: this one takes ~1.5 minutes, and it
    # runs on the self-hosted box, where a hung job holds the runner hostage
    # rather than just burning hosted minutes.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Reads the packageManager pin from package.json rather than
          # floating to whatever latest pnpm 10.x exists at run time.
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          # pnpm must already be on PATH before this step: setup-node's
          # package-manager-cache auto-detection reads the packageManager
          # field above and shells out to the pnpm binary to resolve the
          # store path.
          cache: 'pnpm'
          # No registry-url/scope: @poodle64/design-tokens and @poodle64/ui are
          # public on registry.npmjs.org, so the default registry serves them with
          # no credential. Setting registry-url here writes an .npmrc pointing the
          # scope at GitHub Packages, which then 404s every published version
          # (2026-08-14).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: CSS lint (stylelint)
        run: pnpm lint:css

      - name: Unit tests (vitest)
        run: pnpm test:run

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Inline ntfy notify: thoth is a private repo; composite actions from
          # poodle64/master-project (also private) cannot be resolved at
          # job-setup time on any runner. Atlas self-hosted reads the host token.
          TOKEN=""
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -r "$f" ] && TOKEN="$(cat "$f")" && break
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no host token file readable — notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: thoth: frontend failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy notify POST failed"
