# Pre-commit hooks configuration for thoth

# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # ---------------------------------------------------------------------------- #
  #                              Security Scanning                                #
  # ---------------------------------------------------------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "security - Detect hardcoded secrets"

  - repo: local
    hooks:
      - id: check-pii
        name: "security - Detect PII (names, mobiles, personal emails)"
        # Path corrected: .claude/hooks/master/precommit/pii.py never existed —
        # the real script is check-pii.py, which takes staged filenames as argv
        # exactly as pre-commit passes them.
        #
        # Hooks now come from the mimir plugin rather than a symlink (see the
        # master setup-symlinks command), and mimir is not installed here, so
        # this is currently INERT: the guard skips when the script is absent
        # rather than failing every commit. It starts working again on any
        # machine that provides the path, with no config change.
        entry: bash -c 'test -f .claude/hooks/master/check-pii.py || exit 0; exec python3 .claude/hooks/master/check-pii.py "$@"' --
        language: system
        types: [text]

  # ---------------------------------------------------------------------------- #
  #                              File Validation                                  #
  # ---------------------------------------------------------------------------- #

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: "files - Fix end of files"
      - id: trailing-whitespace
        name: "files - Trim trailing whitespace"
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        name: "yaml - Validate YAML syntax"
        args: [--unsafe]
      - id: check-toml
        name: "toml - Validate TOML syntax"
      - id: check-json
        name: "json - Validate JSON syntax"
      - id: check-merge-conflict
        name: "git - Detect conflict markers"
      - id: check-added-large-files
        name: "git - Block large file commits"
        args: ["--maxkb=5000"]
      - id: check-case-conflict
        name: "filesystem - Check case sensitivity"
      - id: detect-private-key
        name: "security - Detect private keys"
