# Pre-commit hooks configuration for thoth

# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # ---------------------------------------------------------------------------- #
  #                              Security Scanning                                #
  # ---------------------------------------------------------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "security - Detect hardcoded secrets"

  - repo: local
    hooks:
      - id: check-pii
        name: "security - Detect PII (names, mobiles, personal emails)"
        entry: household-precommit-pii
        language: system
        types: [text]

  # ---------------------------------------------------------------------------- #
  #                              File Validation                                  #
  # ---------------------------------------------------------------------------- #

  # ---------------------------------------------------------------------------- #
  #                              Frontend / Design                                #
  # ---------------------------------------------------------------------------- #

  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        entry: pnpm check
        language: system
        types_or: [svelte, ts]
        pass_filenames: false

      - id: stylelint
        name: stylelint (blocks raw colour literals)
        entry: pnpm lint:css
        language: system
        types_or: [svelte, css]
        pass_filenames: false

      # Both gate on NEW findings only, against a checked-in baseline, so they
      # never fail on the backlog that existed when they landed. Rebank with
      # `pnpm lint:drift --baseline` / `pnpm lint:design --baseline`.
      - id: check-ui-drift
        name: design - Hand-rolled what @poodle64/ui already ships
        entry: pnpm lint:drift
        language: system
        types_or: [svelte, ts]
        pass_filenames: false

      - id: check-design-craft
        name: design - Craft defects no other gate can see
        entry: pnpm lint:design
        language: system
        types_or: [svelte, ts, css]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: "files - Fix end of files"
      - id: trailing-whitespace
        name: "files - Trim trailing whitespace"
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        name: "yaml - Validate YAML syntax"
        args: [--unsafe]
      - id: check-toml
        name: "toml - Validate TOML syntax"
      - id: check-json
        name: "json - Validate JSON syntax"
      - id: check-merge-conflict
        name: "git - Detect conflict markers"
      - id: check-added-large-files
        name: "git - Block large file commits"
        args: ["--maxkb=5000"]
      - id: check-case-conflict
        name: "filesystem - Check case sensitivity"
      - id: detect-private-key
        name: "security - Detect private keys"
